name: Refresh coefficient snapshots
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6,18 * * *'
permissions:
  contents: write
concurrency:
  group: coefficient-snapshots
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Download and validate snapshots
        run: python scripts/refresh_coefficients.py
      - name: Commit only validated changes
        run: |
          git add v2/data/countries.json v2/data/clubs.json
          if git diff --cached --quiet; then
            echo "No validated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh validated third-party coefficient snapshots"
          git push
