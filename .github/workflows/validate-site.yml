name: Validate Coefficient Hub
on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/validate-site.yml'
  pull_request:
    paths:
      - 'v2/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/validate-site.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install importer dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Run offline data regression tests
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax and internal navigation
        run: node scripts/validate_site.cjs
