name: Audit UEFA match sources (read only)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_uefa_fixtures.py'
      - 'tests/test_uefa_audit.py'
      - '.github/workflows/audit-uefa-fixtures.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 7 * * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Test offline reconciliation logic
        run: python -m unittest discover -s tests -p 'test_uefa_audit.py' -v
      - name: Compare published archive with UEFA news articles
        run: python scripts/audit_uefa_fixtures.py --output uefa-fixture-audit.json
        timeout-minutes: 3
      - name: Publish readable audit summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          output=Path("uefa-fixture-audit.json")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("## UEFA fixture reconciliation (read-only)\\n\\n")
              if not output.exists():
                  f.write("No report was generated. Check job logs.\\n")
              else:
                  data=json.loads(output.read_text(encoding="utf-8"))
                  f.write("| Competition | Confirmed | New final scores | Conflicts | Missing archive | Missing source |\\n")
                  f.write("|---|---:|---:|---:|---:|---:|\\n")
                  for name,entry in data["competitions"].items():
                      if "error" in entry:
                          f.write(f"| {name} | ERROR | — | — | — | — |\\n")
                      else:
                          f.write(f"| {name} | {entry['verified']} | {len(entry['pending_results'])} | {len(entry['conflicts'])} | {len(entry['not_in_archive'])} | {len(entry['not_in_source'])} |\\n")
                  f.write("\\nSource parsing errors mean **no verification**, not zero discrepancies. No published data is modified.\\n")
          PY
      - name: Save audit for review, even if sources fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uefa-fixture-audit
          path: uefa-fixture-audit.json
          if-no-files-found: warn
          retention-days: 14
